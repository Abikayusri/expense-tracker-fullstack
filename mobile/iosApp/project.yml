name: iosApp
options:
  bundleIdPrefix: com.abika.expense
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Expense Tracker
        # Required by Compose Multiplatform for ProMotion frame rates.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        # Lets the simulator reach the backend on http://localhost during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ApiBaseUrl: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abika.expense.ios
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Kotlin framework is built for Apple-silicon simulators only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
